<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorpresa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, sans-serif;
        }

        /* Capa inicial */
        #overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #220 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            color: #ffde00;
            text-align: center;
            transition: opacity 0.8s;
        }

        /* Contenedor del Spotify - Oculto al inicio */
        #music-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 350px;
            z-index: 50;
            display: none;
            /* Se activa al dar click al sol */
            opacity: 0;
            transition: opacity 1s;
        }

        #music-container.devil-mode {
            transition: opacity 2.8s;
        }

        #surprise-button {
            position: absolute;
            left: 50%;
            bottom: 8%;
            transform: translateX(-50%);
            z-index: 70;
            display: none;
            padding: 14px 24px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            background: rgba(60, 0, 0, 0.78);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        #password-modal {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 120;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
        }

        #password-modal.open {
            display: flex;
        }

        .password-card {
            width: min(86vw, 320px);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(20, 0, 0, 0.88);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            color: #fff;
            text-align: center;
        }

        .password-card h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: #ffb3b3;
        }

        .password-card p {
            margin: 0 0 14px 0;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.72);
        }

        #password-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            outline: none;
        }

        #password-error {
            min-height: 18px;
            margin: 10px 0 0 0;
            color: #ff7d7d;
            font-size: 0.8rem;
        }

        .password-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .password-actions button {
            flex: 1;
            padding: 11px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            cursor: pointer;
            font-weight: 700;
        }

        .password-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .password-submit {
            background: #8f1010;
            color: #fff;
            border-color: rgba(255, 80, 80, 0.45);
        }

        .close-music {
            color: #ffde00;
            text-align: center;
            cursor: pointer;
            margin: 15px auto 0 auto;
            /* Centrado horizontal con margen arriba */
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.7);
            /* Fondo negro con 70% de opacidad */
            width: 200px;
            padding: 10px 5px;
            /* Espacio interno para que no se vea apretado */
            border: 1px solid #ffde00;
            /* Un borde delgadito para que resalte más */
            border-radius: 20px;
            /* Bordes redondeados tipo iPhone */
            backdrop-filter: blur(5px);
            /* Efecto de desenfoque al fondo (muy elegante) */
            display: block;
            /* Asegura que respete el ancho y el centrado */
        }

        .close-hint {
            margin: 14px 0 8px 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
        }

        #music-container.devil-mode .close-music {
            color: #ff4d4d;
            border-color: #ff4d4d;
        }

        #music-container.devil-mode .close-hint {
            color: rgba(255, 90, 90, 0.78);
        }
        
        /* Mensaje flotante de instrucción */
        #zoom-hint {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            z-index: 60;
            opacity: 0;
            transition: opacity 1.5s;
            pointer-events: none; /* Para que no estorbe al tocar */
        }
        
    </style>
</head>

<body>

    <div id="overlay" onclick="startApp()">
        <h1>Perdón si no es un ramo hoy, pero lo hice con mucho cariño</h1>
        <p style="color: white; opacity: 0.6; font-size: 0.9rem;">(Toca para abrirlo)</p>
    </div>

    <div id="music-container">

        <iframe data-testid="embed-iframe" style="border-radius:12px"
            src="https://open.spotify.com/embed/track/2JurHzCT0Qh9IeqzuhWqjg?utm_source=generator&theme=0" width="100%"
            height="152" frameBorder="0" allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        <div class="close-hint">Toca el boton blanco</div>
        <div class="close-music" onclick="toggleMusic()">Cerrar</div>
        
    </div>
    
    <div id="zoom-hint">✨ Puedes hacer zoom con dos dedos ✨</div>

    <button id="surprise-button" onclick="openPasswordModal()">toca aquí y verás</button>

    <div id="password-modal" onclick="handlePasswordBackdrop(event)">
        <div class="password-card">
            <h3>Clave secreta</h3>
            <p>Escribe cuánto vale X.</p>
            <p>3X - 203 = 4</p>
            <input id="password-input" type="password" placeholder="Contraseña" onkeydown="handlePasswordKey(event)">
            <div id="password-error"></div>
            <div class="password-actions">
                <button class="password-cancel" onclick="closePasswordModal()" type="button">Cancelar</button>
                <button class="password-submit" onclick="submitPassword()" type="button">Entrar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, sun, sunGlowSprite, stars, musicAutoOpenTimeout;
        const flowers = [];
        const devilMessages = ['Mamasita­', 'Hermosa', 'Deliciosa','Solo para mí', 'Me encantas', 'Sexo?', 'Más sexo?', 'Que rico usted, mi amor', 'Ñam', 'Grr'];
        const messages = ['Mi princesa', 'Cachetona hermosa', 'Mi ingeniera favorita', 'Mi patrona', 'Mi amor', 'Me encantas', 'JAMÁS', 'La que me domina'];

        const devilPassword = '69';
        const isAppleWebKit = /WebKit/i.test(navigator.userAgent) && /(iPhone|iPad|iPod|Macintosh)/i.test(navigator.userAgent) && !/(CriOS|Chrome|EdgiOS|FxiOS)/i.test(navigator.userAgent);
        const spriteBlendMode = isAppleWebKit ? THREE.NormalBlending : THREE.AdditiveBlending;

        function startApp() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                init();
                animate();
                // Mostrar el mensaje de zoom y ocultarlo después
                const zh = document.getElementById('zoom-hint');
                zh.style.opacity = '1';
                setTimeout(() => {
                    zh.style.opacity = '0';
                }, 5000); // Se va a los 5 segundos
                // Mostramos la música después de un ratico o al tocar
                document.getElementById('surprise-button').style.display = 'block';
                musicAutoOpenTimeout = setTimeout(toggleMusic, 9000);
            }, 800);
        }

        function toggleMusic() {
            const mc = document.getElementById('music-container');
            if (mc.style.display === 'none' || mc.style.display === '') {
                mc.style.display = 'block';
                const fadeDelay = mc.classList.contains('devil-mode') ? 700 : 10;
                setTimeout(() => mc.style.opacity = '1', fadeDelay);
            } else {
                mc.style.opacity = '0';
                const hideDelay = mc.classList.contains('devil-mode') ? 2800 : 1000;
                setTimeout(() => mc.style.display = 'none', hideDelay);
            }
        }

        function openPasswordModal() {
            const modal = document.getElementById('password-modal');
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');
            error.textContent = '';
            input.value = '';
            modal.classList.add('open');
            setTimeout(() => input.focus(), 20);
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.remove('open');
        }

        function handlePasswordBackdrop(event) {
            if (event.target.id === 'password-modal') {
                closePasswordModal();
            }
        }

        function handlePasswordKey(event) {
            if (event.key === 'Enter') {
                submitPassword();
            }
        }

        function submitPassword() {
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');

            if (input.value === devilPassword) {
                closePasswordModal();
                revealDiablito();
                return;
            }

            error.textContent = 'Contraseña incorrecta';
            input.focus();
            input.select();
        }

        function createCanvasTexture(canvas) {
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            texture.needsUpdate = true;
            return texture;
        }

        function createTextTexture(text, fillColor = '#ffde00', glowColor = '#ffaa00') {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 70px sans-serif';
            ctx.fillStyle = fillColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 25;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            return createCanvasTexture(canvas);
        }

        function createEmojiTexture(emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '80px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, 64, 70);
            return createCanvasTexture(canvas);
        }

        function updateIframeTrack() {
            const iframe = document.querySelector('#music-container iframe');
            iframe.src = 'https://open.spotify.com/embed/track/6xqbec9MHRmW7qtEINAlRx?utm_source=generator';
        }

        function revealDiablito() {
            if (!sun) return;

            if (musicAutoOpenTimeout) {
                clearTimeout(musicAutoOpenTimeout);
                musicAutoOpenTimeout = null;
            }

            sun.material.color.set(0xff2a2a);
            if (stars) {
                stars.material.color.set(0xff4d4d);
                stars.material.needsUpdate = true;
            }

            if (sunGlowSprite) {
                const glowCanvas = document.createElement('canvas');
                glowCanvas.width = 256;
                glowCanvas.height = 256;
                const ctx = glowCanvas.getContext('2d');
                const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                grad.addColorStop(0, 'rgba(255, 70, 70, 1)');
                grad.addColorStop(0.5, 'rgba(255, 0, 0, 0.45)');
                grad.addColorStop(1, 'rgba(120, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 256, 256);
                sunGlowSprite.material.map = createCanvasTexture(glowCanvas);
                sunGlowSprite.material.needsUpdate = true;
            }

            const devilTexture = createEmojiTexture('😈');
            flowers.forEach(f => {
                if (f.isMessage) {
                    const randomMessage = devilMessages[Math.floor(Math.random() * devilMessages.length)] || '';
                    f.mesh.material.map = createTextTexture(randomMessage, '#ff4d4d', '#ff0000');
                    f.mesh.material.needsUpdate = true;
                    f.mesh.visible = true;
                    f.mesh.scale.set(160, 40, 1);
                    return;
                }

                f.mesh.material.map = devilTexture;
                f.mesh.material.needsUpdate = true;
                f.mesh.scale.set(28, 28, 1);
            });

            updateIframeTrack();
            document.getElementById('surprise-button').style.display = 'none';

            const mc = document.getElementById('music-container');
            mc.classList.add('devil-mode');
            if (mc.style.display === 'none' || mc.style.display === '') {
                toggleMusic();
            }
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 900, 2500);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.1;

            // --- EL SOL ---
            const sunSize = 150;
            sun = new THREE.Mesh(new THREE.SphereGeometry(sunSize, 32, 32), new THREE.MeshBasicMaterial({ color: 0xfff000 }));
            scene.add(sun);

            // Resplandor del Sol
            const sunGlowCanvas = document.createElement('canvas');
            sunGlowCanvas.width = 256; sunGlowCanvas.height = 256;
            const sCtx = sunGlowCanvas.getContext('2d');
            const sGrad = sCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
            sGrad.addColorStop(0, 'rgba(255, 230, 0, 1)');
            sGrad.addColorStop(0.5, 'rgba(255, 150, 0, 0.4)');
            sGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
            sCtx.fillStyle = sGrad;
            sCtx.fillRect(0, 0, 256, 256);
            sunGlowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: createCanvasTexture(sunGlowCanvas),
                blending: spriteBlendMode,
                transparent: true,
                depthWrite: false
            }));
            sunGlowSprite.scale.set(sunSize * 8, sunSize * 8, 1);
            scene.add(sunGlowSprite);

            // Flores
            const fCanvas = document.createElement('canvas');
            fCanvas.width = 128; fCanvas.height = 128;
            const fCtx = fCanvas.getContext('2d');
            fCtx.font = '80px serif'; fCtx.textAlign = 'center'; fCtx.textBaseline = 'middle';
            fCtx.fillText('🌻', 64, 70);
            const flowerTexture = createCanvasTexture(fCanvas);

            for (let i = 0; i < 900; i++) {
                const isMsg = Math.random() < 0.25;
                const mat = new THREE.SpriteMaterial({
                    map: isMsg ? createTextTexture(messages[Math.floor(Math.random() * messages.length)]) : flowerTexture,
                    transparent: true,
                    blending: spriteBlendMode,
                    depthWrite: false
                });
                const sprite = new THREE.Sprite(mat);
                const radius = THREE.MathUtils.randFloat(200, 900);
                const angle = Math.random() * Math.PI * 2;
                const speed = THREE.MathUtils.randFloat(0.0002, 0.001);
                const yOff = THREE.MathUtils.randFloatSpread(300);
                sprite.position.set(Math.cos(angle) * radius, yOff, Math.sin(angle) * radius);
                sprite.scale.set(isMsg ? 160 : 25, isMsg ? 40 : 25, 1);
                flowers.push({ mesh: sprite, radius, angle, speed, yOff, isMessage: isMsg });
                scene.add(sprite);
            }

            // Estrellas
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for (let i = 0; i < 7000; i++) {
                starPos.push(THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000));
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 }));
            scene.add(stars);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.00005;
            flowers.forEach(f => {
                f.angle += f.speed;
                f.mesh.position.x = Math.cos(f.angle) * f.radius;
                f.mesh.position.z = Math.sin(f.angle) * f.radius;
                f.mesh.position.y = f.yOff + Math.sin(time + f.radius) * 25;
            });
            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>

</html>

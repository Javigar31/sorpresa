<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Una sorpresa especial llena de flores y amor">
    <title>Sorpresa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN TOKENS — Rosa & Turquesa
        ============================================================ */
        :root {
            --pink-vivid:    hsl(330, 90%, 65%);
            --pink-soft:     hsl(330, 80%, 80%);
            --pink-glow:     hsl(330, 100%, 70%);
            --teal-vivid:    hsl(175, 85%, 50%);
            --teal-soft:     hsl(175, 70%, 70%);
            --teal-glow:     hsl(185, 90%, 55%);
            --overlay-bg1:   hsl(300, 40%, 6%);
            --overlay-bg2:   hsl(200, 40%, 4%);
            --font-main:     'Outfit', -apple-system, sans-serif;
        }

        /* ============================================================
           REDUCED MOTION — WCAG compliant
        ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================================
           BASE
        ============================================================ */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-main);
        }

        /* ============================================================
           OVERLAY INICIAL — glassmorphism + gradiente rosa-turquesa
        ============================================================ */
        #overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 30% 40%, hsl(330, 70%, 18%) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 65%, hsl(175, 70%, 12%) 0%, transparent 55%),
                radial-gradient(circle at center, hsl(260, 30%, 8%) 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            text-align: center;
            transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Orbes decorativos en el overlay */
        #overlay::before {
            content: '';
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, hsla(330, 90%, 65%, 0.18) 0%, transparent 70%);
            top: -60px;
            left: -80px;
            pointer-events: none;
        }
        #overlay::after {
            content: '';
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, hsla(175, 85%, 50%, 0.16) 0%, transparent 70%);
            bottom: -40px;
            right: -60px;
            pointer-events: none;
        }

        /* Tarjeta glassmorphism central */
        .overlay-card {
            position: relative;
            padding: 40px 48px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 80px hsla(330, 90%, 65%, 0.08),
                0 0 80px hsla(175, 85%, 50%, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: min(88vw, 360px);
        }

        /* Emoji decorativo */
        .overlay-emoji {
            font-size: 3.2rem;
            line-height: 1;
            filter: drop-shadow(0 0 18px hsla(330, 90%, 70%, 0.6));
        }

        /* Título del overlay */
        #overlay h1 {
            margin: 0;
            font-family: var(--font-main);
            font-size: clamp(1.6rem, 6vw, 2.2rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.15;
            background: linear-gradient(
                135deg,
                var(--pink-soft)  0%,
                var(--pink-vivid) 35%,
                var(--teal-vivid) 70%,
                var(--teal-soft)  100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 12px hsla(330, 80%, 60%, 0.35));
        }

        /* Subtítulo */
        .overlay-sub {
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: hsla(175, 60%, 80%, 0.75);
            margin: 0;
        }

        /* Indicador de toque pulsante */
        .tap-indicator {
            margin-top: 8px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-vivid), var(--teal-vivid));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow:
                0 0 0 0 hsla(330, 90%, 65%, 0.4),
                0 4px 20px hsla(330, 90%, 65%, 0.35);
        }

        /* Animaciones de entrada escalonadas */
        @media (prefers-reduced-motion: no-preference) {
            .overlay-emoji {
                animation:
                    overlayFadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both,
                    floatEmoji 3.5s ease-in-out 1s infinite;
            }
            #overlay h1 {
                animation: overlayFadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
            }
            .overlay-sub {
                animation: overlayFadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
            }
            .tap-indicator {
                animation:
                    overlayFadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both,
                    pulseTap 2s ease-in-out 1.4s infinite;
            }
            .overlay-orb-1, .overlay-orb-2 {
                animation: orbDrift 8s ease-in-out infinite alternate;
            }
            .overlay-orb-2 {
                animation-delay: -4s;
                animation-duration: 11s;
            }
        }

        @keyframes overlayFadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatEmoji {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50%       { transform: translateY(-8px) rotate(3deg); }
        }
        @keyframes pulseTap {
            0%, 100% {
                box-shadow: 0 0 0 0 hsla(330, 90%, 65%, 0.5), 0 4px 20px hsla(330, 90%, 65%, 0.35);
            }
            60% {
                box-shadow: 0 0 0 14px hsla(330, 90%, 65%, 0), 0 4px 20px hsla(330, 90%, 65%, 0.35);
            }
        }
        @keyframes orbDrift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(20px, -15px) scale(1.08); }
        }

        /* ============================================================
           MÚSICA
        ============================================================ */
        #music-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 350px;
            z-index: 50;
            display: none;
            opacity: 0;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #music-container.devil-mode {
            transition: opacity 2.8s;
        }

        /* ============================================================
           BOTÓN SORPRESA — glassmorphism rosa-turquesa
        ============================================================ */
        #surprise-button {
            position: absolute;
            left: 50%;
            bottom: 1%;
            transform: translateX(-50%);
            z-index: 70;
            display: none;
            padding: 15px 28px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(
                135deg,
                hsla(330, 70%, 25%, 0.82),
                hsla(175, 70%, 18%, 0.82)
            );
            color: #fff;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 12px 32px rgba(0, 0, 0, 0.4),
                0 0 24px hsla(330, 80%, 60%, 0.2);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        background 0.3s ease;
        }

        #surprise-button:hover {
            transform: translateX(-50%) translateY(-3px) scale(1.04);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 18px 40px rgba(0, 0, 0, 0.45),
                0 0 36px hsla(330, 80%, 60%, 0.35);
        }
        #surprise-button:active {
            transform: translateX(-50%) translateY(0) scale(0.97);
        }
        #surprise-button:focus-visible {
            outline: 2px solid var(--teal-vivid);
            outline-offset: 3px;
        }

        /* ============================================================
           MODAL CONTRASEÑA
        ============================================================ */
        #password-modal {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 120;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        #password-modal.open {
            display: flex;
        }

        .password-card {
            width: min(86vw, 320px);
            padding: 24px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(12, 4, 18, 0.9);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.5),
                0 0 40px hsla(330, 80%, 50%, 0.08);
            color: #fff;
            text-align: center;
            font-family: var(--font-main);
        }

        .password-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--pink-soft);
        }

        .password-card p {
            margin: 0 0 14px 0;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.68);
        }

        #password-input {
            text-align: center;
            width: 32%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-family: var(--font-main);
            outline: none;
            transition: border-color 0.25s;
        }
        #password-input:focus {
            border-color: hsla(330, 80%, 65%, 0.6);
            box-shadow: 0 0 0 3px hsla(330, 80%, 65%, 0.12);
        }

        #password-error {
            min-height: 18px;
            margin: 10px 0 0 0;
            color: #ff7d7d;
            font-size: 0.8rem;
        }

        .password-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .password-actions button {
            flex: 1;
            padding: 11px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 700;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .password-actions button:active { transform: scale(0.96); }
        .password-actions button:focus-visible {
            outline: 2px solid var(--teal-vivid);
            outline-offset: 2px;
        }

        .password-cancel {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }

        .password-submit {
            background: linear-gradient(135deg, hsl(330, 75%, 40%), hsl(330, 65%, 30%));
            color: #fff;
            border-color: rgba(255, 80, 80, 0.35);
        }
        .password-submit:hover {
            background: linear-gradient(135deg, hsl(330, 80%, 48%), hsl(330, 70%, 36%));
        }

        /* ============================================================
           CERRAR MÚSICA
        ============================================================ */
        .close-music {
            color: var(--pink-soft);
            text-align: center;
            cursor: pointer;
            margin: 15px auto 0 auto;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.04em;
            background: rgba(0, 0, 0, 0.65);
            width: 200px;
            padding: 11px 5px;
            border: 1px solid hsla(330, 70%, 60%, 0.45);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            display: block;
            transition: border-color 0.25s, color 0.25s, transform 0.2s ease;
        }
        .close-music:hover {
            transform: scale(1.04);
            border-color: hsla(330, 80%, 70%, 0.7);
        }

        .close-hint {
            margin: 14px 0 8px 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            font-family: var(--font-main);
        }

        #music-container.devil-mode .close-music {
            color: #ff4d4d;
            border-color: #ff4d4d;
        }

        #music-container.devil-mode .close-hint {
            color: rgba(255, 90, 90, 0.78);
        }

        /* ============================================================
           HINT DE ZOOM
        ============================================================ */
        #zoom-hint {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.04em;
            z-index: 60;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="overlay" onclick="startApp()" role="button" aria-label="Toca para abrir la sorpresa" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')startApp()">
        <div class="overlay-card" aria-hidden="true">
            <span class="overlay-emoji">🌷</span>
            <h1>Toca para abrirlo</h1>
            <p class="overlay-sub">Es poquito, pero para ti</p>
            <div class="tap-indicator" aria-hidden="true">✨</div>
        </div>
    </div>

    <div id="music-container">

        <iframe data-testid="embed-iframe" style="border-radius:12px"
            src="https://open.spotify.com/embed/track/77pDO4WZPIdkwFve0iHWnb?utm_source=generator" width="100%"
            height="152" frameBorder="0" allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        <div class="close-hint">Toca el boton blanco</div>
        <div class="close-music" onclick="toggleMusic()">Cerrar</div>

    </div>

    <div id="zoom-hint">✨ Puedes hacer zoom con dos dedos ✨</div>

    <button id="surprise-button" onclick="openPasswordModal()">toca aquí y verás</button>

    <div id="password-modal" onclick="handlePasswordBackdrop(event)">
        <div class="password-card">
            <h3>Clave secreta</h3>
            <p>Escribe la fecha en la que cogimos por primera vez</p>
            <p>dd/mm</p>
            <input id="password-input" type="password" onkeydown="handlePasswordKey(event)">
            <div id="password-error"></div>
            <div class="password-actions">
                <button class="password-cancel" onclick="closePasswordModal()" type="button">Cancelar</button>
                <button class="password-submit" onclick="submitPassword()" type="button">Entrar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, sun, sunGlowSprite, stars, musicAutoOpenTimeout;
        const flowers = [];
        const devilMessages = ['Duro?', 'Mamasita­', 'Hermosa', 'Deliciosa', 'Solo para mí', 'Me encantas', 'Sexo?', 'Más sexo?', 'Que rico tú', 'Ñam', 'Grr','Que ganas de cogerte'];
        const messages = ['Cosota hermosa', 'Mi cajera favorita', 'Mi patrona', 'Me encantas', 'La que me domina', 'Los ojos más hermosos','Todo tuyo'];

        const devilPassword = '29/05';
        const isAppleWebKit = /WebKit/i.test(navigator.userAgent) && /(iPhone|iPad|iPod|Macintosh)/i.test(navigator.userAgent) && !/(CriOS|Chrome|EdgiOS|FxiOS)/i.test(navigator.userAgent);
        const spriteBlendMode = isAppleWebKit ? THREE.NormalBlending : THREE.AdditiveBlending;

        function startApp() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                init();
                animate();
                // Mostrar el mensaje de zoom y ocultarlo después
                const zh = document.getElementById('zoom-hint');
                zh.style.opacity = '1';
                setTimeout(() => {
                    zh.style.opacity = '0';
                }, 5000); // Se va a los 5 segundos
                // Mostramos la música después de un ratico o al tocar
                document.getElementById('surprise-button').style.display = 'block';
                musicAutoOpenTimeout = setTimeout(toggleMusic, 9000);
            }, 800);
        }

        function toggleMusic() {
            const mc = document.getElementById('music-container');
            if (mc.style.display === 'none' || mc.style.display === '') {
                mc.style.display = 'block';
                const fadeDelay = mc.classList.contains('devil-mode') ? 700 : 10;
                setTimeout(() => mc.style.opacity = '1', fadeDelay);
            } else {
                mc.style.opacity = '0';
                const hideDelay = mc.classList.contains('devil-mode') ? 2800 : 1000;
                setTimeout(() => mc.style.display = 'none', hideDelay);
            }
        }

        function openPasswordModal() {
            const modal = document.getElementById('password-modal');
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');
            error.textContent = '';
            input.value = '';
            modal.classList.add('open');
            setTimeout(() => input.focus(), 20);
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.remove('open');
        }

        function handlePasswordBackdrop(event) {
            if (event.target.id === 'password-modal') {
                closePasswordModal();
            }
        }

        function handlePasswordKey(event) {
            if (event.key === 'Enter') {
                submitPassword();
            }
        }

        function submitPassword() {
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');

            if (input.value === devilPassword) {
                closePasswordModal();
                revealDiablito();
                return;
            }

            error.textContent = 'Contraseña incorrecta';
            input.focus();
            input.select();
        }

        function createCanvasTexture(canvas) {
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            texture.needsUpdate = true;
            return texture;
        }

        function createTextTexture(text, fillColor = '#ff8cd0', glowColor = '#00d4c8') {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 70px sans-serif';
            ctx.fillStyle = fillColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 28;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            return createCanvasTexture(canvas);
        }

        function createEmojiTexture(emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '80px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, 64, 70);
            return createCanvasTexture(canvas);
        }

        function updateIframeTrack() {
            const iframe = document.querySelector('#music-container iframe');
            iframe.src = 'https://open.spotify.com/embed/track/6xqbec9MHRmW7qtEINAlRx?utm_source=generator';
        }

        function revealDiablito() {
            if (!sun) return;

            if (musicAutoOpenTimeout) {
                clearTimeout(musicAutoOpenTimeout);
                musicAutoOpenTimeout = null;
            }

            sun.material.color.set(0xff2a2a);
            if (stars) {
                stars.material.color.set(0xff4d4d);
                stars.material.needsUpdate = true;
            }

            if (sunGlowSprite) {
                const glowCanvas = document.createElement('canvas');
                glowCanvas.width = 256;
                glowCanvas.height = 256;
                const ctx = glowCanvas.getContext('2d');
                const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                grad.addColorStop(0, 'rgba(255, 70, 70, 1)');
                grad.addColorStop(0.5, 'rgba(255, 0, 0, 0.45)');
                grad.addColorStop(1, 'rgba(120, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 256, 256);
                sunGlowSprite.material.map = createCanvasTexture(glowCanvas);
                sunGlowSprite.material.needsUpdate = true;
            }

            const devilTexture = createEmojiTexture('😈');
            flowers.forEach(f => {
                if (f.isMessage) {
                    const randomMessage = devilMessages[Math.floor(Math.random() * devilMessages.length)] || '';
                    f.mesh.material.map = createTextTexture(randomMessage, '#ff4d4d', '#ff0000');
                    f.mesh.material.needsUpdate = true;
                    f.mesh.visible = true;
                    f.mesh.scale.set(160, 40, 1);
                    return;
                }

                f.mesh.material.map = devilTexture;
                f.mesh.material.needsUpdate = true;
                f.mesh.scale.set(28, 28, 1);
            });

            updateIframeTrack();
            document.getElementById('surprise-button').style.display = 'none';

            const mc = document.getElementById('music-container');
            mc.classList.add('devil-mode');
            if (mc.style.display === 'none' || mc.style.display === '') {
                toggleMusic();
            }
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 900, 2500);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.1;

            // --- EL SOL — tonos rosa-turquesa ---
            const sunSize = 150;
            // Color inicial: rosa vibrante (hex: 0xff5fab = hsl ~330 90% 65%)
            sun = new THREE.Mesh(new THREE.SphereGeometry(sunSize, 32, 32), new THREE.MeshBasicMaterial({ color: 0xff5fab }));
            scene.add(sun);

            // Resplandor del Sol — rosa con halo turquesa
            const sunGlowCanvas = document.createElement('canvas');
            sunGlowCanvas.width = 256; sunGlowCanvas.height = 256;
            const sCtx = sunGlowCanvas.getContext('2d');
            const sGrad = sCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
            sGrad.addColorStop(0,   'rgba(255, 130, 200, 1)');
            sGrad.addColorStop(0.3, 'rgba(255, 80, 160, 0.7)');
            sGrad.addColorStop(0.6, 'rgba(0, 210, 200, 0.3)');
            sGrad.addColorStop(1,   'rgba(0, 180, 180, 0)');
            sCtx.fillStyle = sGrad;
            sCtx.fillRect(0, 0, 256, 256);
            sunGlowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: createCanvasTexture(sunGlowCanvas),
                blending: spriteBlendMode,
                transparent: true,
                depthWrite: false
            }));
            sunGlowSprite.scale.set(sunSize * 8, sunSize * 8, 1);
            scene.add(sunGlowSprite);

            // Flores
            const fCanvas = document.createElement('canvas');
            fCanvas.width = 128; fCanvas.height = 128;
            const fCtx = fCanvas.getContext('2d');
            fCtx.font = '80px serif'; fCtx.textAlign = 'center'; fCtx.textBaseline = 'middle';
            fCtx.fillText('🌷', 64, 70);
            const flowerTexture = createCanvasTexture(fCanvas);

            // Textura de lirio alternada
            const lCanvas = document.createElement('canvas');
            lCanvas.width = 128; lCanvas.height = 128;
            const lCtx = lCanvas.getContext('2d');
            lCtx.font = '80px serif'; lCtx.textAlign = 'center'; lCtx.textBaseline = 'middle';
            lCtx.fillText('🌸', 64, 70);
            const lilyTexture = createCanvasTexture(lCanvas);

            for (let i = 0; i < 900; i++) {
                const isMsg = Math.random() < 0.25;
                // Alternar tulipán y lirio (proporción 60/40)
                const useLily = !isMsg && Math.random() < 0.4;
                const mat = new THREE.SpriteMaterial({
                    map: isMsg ? createTextTexture(messages[Math.floor(Math.random() * messages.length)]) : (useLily ? lilyTexture : flowerTexture),
                    transparent: true,
                    blending: spriteBlendMode,
                    depthWrite: false
                });
                const sprite = new THREE.Sprite(mat);
                const radius = THREE.MathUtils.randFloat(200, 900);
                const angle = Math.random() * Math.PI * 2;
                const speed = THREE.MathUtils.randFloat(0.0002, 0.001);
                const yOff = THREE.MathUtils.randFloatSpread(300);
                sprite.position.set(Math.cos(angle) * radius, yOff, Math.sin(angle) * radius);
                sprite.scale.set(isMsg ? 160 : 25, isMsg ? 40 : 25, 1);
                flowers.push({ mesh: sprite, radius, angle, speed, yOff, isMessage: isMsg });
                scene.add(sprite);
            }

            // Estrellas
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for (let i = 0; i < 30000; i++) {
                starPos.push(THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000));
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 }));
            scene.add(stars);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.00005;
            flowers.forEach(f => {
                f.angle += f.speed;
                f.mesh.position.x = Math.cos(f.angle) * f.radius;
                f.mesh.position.z = Math.sin(f.angle) * f.radius;
                f.mesh.position.y = f.yOff + Math.sin(time + f.radius) * 25;
            });

            // Pulso suave solo de la estela/halo del sol
            if (sunGlowSprite) {
                const glowPulse = 1 + Math.sin(Date.now() * 0.0009) * 0.1;
                sunGlowSprite.scale.setScalar(150 * 8 * glowPulse);
            }

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>

</html>
